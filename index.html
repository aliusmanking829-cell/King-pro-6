<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pro 6 - Step 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        :root {
            --bg-color: #f0f4f9;
            --text-color: #1f1f1f;
            --nav-bg: #ffffff;
            --border-color: #e0e2e5;
            --box-bg: #ffffff;
        }
        body.dark-mode {
            --bg-color: #131314;
            --text-color: #e3e3e3;
            --nav-bg: #1e1f20;
            --border-color: #333537;
            --box-bg: #1e1f20;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background 0.3s, color 0.3s;
        }
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: 500;
        }
        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-color);
            font-size: 0.9rem;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .main-container h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 10px;
        }
        .main-container p {
            color: #707579;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <span class="app-title">King Pro 6</span>
        <button class="theme-toggle-btn" onclick="toggleDarkMode()">🌙 ڈार्क मोड</button>
    </div>

    <div class="main-container">
        <h1>خوش آمدید، علی بھائی!</h1>
        <p>King Pro 6 का Step 1 (Core Layout) सफलताપूर्वक तैयार है।</p>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const btn = document.querySelector(".theme-toggle-btn");
            if(document.body.classList.contains("dark-mode")) {
                btn.innerText = "☀️ لائট موڈ";
            } else {
                btn.innerText = "🌙 ڈार्क मोड";
            }
        }
    </script>
</body>
</html>
