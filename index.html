<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pro 6 - AI Super App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #202123;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Top Header */
        header {
            padding: 15px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            color: #1a73e8;
            font-weight: bold;
        }
        /* Chat Main Screen */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        /* Welcome Section */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            text-align: center;
            gap: 10px;
        }
        .welcome-screen h2 {
            font-size: 1.8rem;
            color: #3c4043;
        }
        /* Message Bubbles */
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .user-message {
            background: #e8f0fe;
            color: #174ea6;
            align-self: flex-start;
        }
        .ai-message {
            background: #ffffff;
            color: #202123;
            align-self: flex-end;
            border: 1px solid #e5e5e5;
        }
        /* Bottom Input Area matching the screenshot */
        .input-container-wrapper {
            padding: 15px 20px;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
        }
        .input-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 30px;
            padding: 8px 15px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: #5f6368;
            cursor: pointer;
            padding: 5px 10px;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #202123;
            font-size: 1rem;
            padding: 8px;
            text-align: right;
        }
        .send-btn {
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>King Pro 6</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <h2>السلام علیکم، علی عثمان کنگ</h2>
            <p>آج ہم کس چیز پر بات کریں؟</p>
        </div>
    </div>

    <div class="input-container-wrapper">
        <div class="input-box">
            <button class="icon-btn" title="Add">＋</button>
            <input type="text" id="userInput" placeholder="Ask King Pro 6..." onkeypress="handleKeyPress(event)">
            <button class="icon-btn" title="Mic">🎤</button>
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6ImIZ2Oiy0WyfLUR0_ud4PvuZNxclU2PCN_yo4LfLSFXA";
        let isFirstMessage = true;

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const welcomeScreen = document.getElementById("welcomeScreen");
            const text = inputField.value.trim();

            if (!text) return;

            if (isFirstMessage && welcomeScreen) {
                welcomeScreen.remove();
                isFirstMessage = false;
            }

            const userMsg = document.createElement("div");
            userMsg.className = "message user-message";
            userMsg.innerText = text;
            chatContainer.appendChild(userMsg);
            
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai-message";
            aiMsg.innerText = "سوچ رہا ہوں...";
            chatContainer.appendChild(aiMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiMsg.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    aiMsg.innerText = "معذرت، کوئی جواب موصول نہیں ہوا۔";
                }
            } catch (error) {
                aiMsg.innerText = "کنکشن کا مسئلہ ہے، براہ کرم دوبارہ کوشش کریں۔";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
