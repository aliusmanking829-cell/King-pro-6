<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pro 6 - AI Super App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Top Header */
        header {
            padding: 15px 20px;
            background: #1e1f20;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            color: #8ab4f8;
            font-weight: bold;
        }
        /* Chat Main Screen */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        /* Welcome / Front Board Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            text-align: center;
            gap: 15px;
        }
        .welcome-screen h2 {
            font-size: 2rem;
            background: linear-gradient(90deg, #8ab4f8, #c58af9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
        }
        .suggestion-card {
            background: #1e1f20;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #c4c7c5;
            transition: background 0.2s;
        }
        .suggestion-card:hover {
            background: #2d2e30;
        }
        /* Message Bubbles */
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .user-message {
            background: #2b2c2f;
            color: #e3e3e3;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            background: #1e1f20;
            color: #e3e3e3;
            align-self: flex-end;
            border: 1px solid #333;
            border-bottom-left-radius: 4px;
        }
        /* Bottom Input Area */
        .input-container-wrapper {
            padding: 15px 20px;
            background: #131314;
            display: flex;
            justify-content: center;
        }
        .input-container {
            display: flex;
            align-items: center;
            background: #1e1f20;
            border: 1px solid #333;
            border-radius: 30px;
            padding: 8px 15px;
            width: 100%;
            max-width: 800px;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 1rem;
            padding: 8px;
        }
        button {
            background: #8ab4f8;
            color: #131314;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        button:hover {
            background: #aecbfa;
        }
    </style>
</head>
<body>

    <header>
        <h1>King Pro 6</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <!-- Front Board / Welcome Section -->
        <div class="welcome-screen" id="welcomeScreen">
            <h2>ہیلو، علی عثمان کنگ</h2>
            <p>آج میں آپ کی کیا مدد کر سکتا ہوں؟</p>
            <div class="suggestions-grid">
                <div class="suggestion-card" onclick="sendPreset('ایک نیا بزنس آئیڈیا بتائیں')">بزنس آئیڈیاز دیکھیں</div>
                <div class="suggestion-card" onclick="sendPreset('پنجابی میں ایک خوبصورت شعر سنائیں')">پنجابی شاعری</div>
                <div class="suggestion-card" onclick="sendPreset('کوڈنگ میں مدد کریں')">کوڈنگ میں مدد</div>
                <div class="suggestion-card" onclick="sendPreset('اپنے بارے میں بتاؤ')">اپنے بارے میں</div>
            </div>
        </div>
    </div>

    <div class="input-container-wrapper">
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ask King Pro 6..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➔</button>
        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6ImIZ2Oiy0WyfLUR0_ud4PvuZNxclU2PCN_yo4LfLSFXA";
        let isFirstMessage = true;

        function sendPreset(text) {
            document.getElementById("userInput").value = text;
            sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const welcomeScreen = document.getElementById("welcomeScreen");
            const text = inputField.value.trim();

            if (!text) return;

            // Remove welcome screen on first message
            if (isFirstMessage && welcomeScreen) {
                welcomeScreen.remove();
                isFirstMessage = false;
            }

            // User Message
            const userMsg = document.createElement("div");
            userMsg.className = "message user-message";
            userMsg.innerText = text;
            chatContainer.appendChild(userMsg);
            
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // AI Loading Message
            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai-message";
            aiMsg.innerText = "سوچ رہا ہوں...";
            chatContainer.appendChild(aiMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiMsg.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    aiMsg.innerText = "معذرت، کوئی جواب موصول نہیں ہوا۔";
                }
            } catch (error) {
                aiMsg.innerText = "کنکشن کا مسئلہ ہے، براہ کرم دوبارہ کوشش کریں۔";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
