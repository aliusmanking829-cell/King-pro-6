<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pro 6 - AI Super App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f7f7f8;
            color: #202123;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 15px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            color: #10a37f;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background: #10a37f;
            color: white;
            align-self: flex-start;
        }
        .ai-message {
            background: #ffffff;
            color: #202123;
            align-self: flex-end;
            border: 1px solid #e5e5e5;
        }
        .input-container {
            padding: 15px 20px;
            background: #ffffff;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d9d9e3;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }
        input:focus {
            border-color: #10a37f;
        }
        button {
            padding: 0 20px;
            background: #10a37f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0d8c6d;
        }
    </style>
</head>
<body>

    <header>
        <h1>King Pro 6</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">السلام علیکم! علی عثمان کنگ، بتائیے میں آپ کی کیا مدد کر سکتا ہوں؟</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="یہاں اپنا پیغام لکھیں..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">بھیجیں</button>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6ImIZ2Oiy0WyfLUR0_ud4PvuZNxclU2PCN_yo4LfLSFXA";
        
        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const chatContainer = document.getElementById("chatContainer");
            const text = inputField.value.trim();

            if (!text) return;

            // User Message Add کریں
            const userMsg = document.createElement("div");
            userMsg.className = "message user-message";
            userMsg.innerText = text;
            chatContainer.appendChild(userMsg);
            
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // AI Loading Message
            const aiMsg = document.createElement("div");
            aiMsg.className = "message ai-message";
            aiMsg.innerText = "سوچ رہا ہوں...";
            chatContainer.appendChild(aiMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiMsg.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    aiMsg.innerText = "معذرت، کوئی جواب موصول نہیں ہوا۔";
                }
            } catch (error) {
                aiMsg.innerText = "کنکشن کا مسئلہ ہے، براہ کرم دوبارہ کوشش کریں۔";
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
