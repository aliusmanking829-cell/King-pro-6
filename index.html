<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Pro 6 - AI Super Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f1f1f;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Top Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            width: 100%;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-icon, .tools-icon {
            font-size: 22px;
            cursor: pointer;
            color: #444;
            background: none;
            border: none;
        }

        .model-selector-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 500;
            color: #1f1f1f;
            cursor: pointer;
        }

        .model-selector-container span {
            font-size: 14px;
            color: #666;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        /* Main Center Area */
        .main-center {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .sparkle-shape {
            font-size: 42px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #4285F4, #9b72cb, #ea4335, #34a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-title {
            font-size: 34px;
            font-weight: 400;
            color: #1f1f1f;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        /* Bottom Chat Bar */
        .bottom-container {
            padding: 16px 20px 24px 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            background: linear-gradient(to top, rgba(255,255,255,1) 80%, rgba(255,255,255,0));
        }

        .chat-input-bar {
            display: flex;
            align-items: center;
            background-color: #f0f4f9;
            border-radius: 32px;
            padding: 8px 12px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
        }

        .input-action-btn {
            background: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #444;
            font-size: 20px;
            transition: background 0.2s;
        }

        .input-action-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .chat-input-field {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0 12px;
            font-size: 16px;
            color: #1f1f1f;
            outline: none;
        }

        .chat-input-field::placeholder {
            color: #747775;
        }

        .mic-btn, .audio-btn {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="menu-icon">☰</button>
            <div class="model-selector-container">
                King Pro 6 <span>▼</span>
            </div>
        </div>
        <div class="header-right">
            <button class="tools-icon">✏️</button>
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="User" class="user-avatar">
        </div>
    </header>

    <!-- Main Center Content -->
    <main class="main-center">
        <div class="sparkle-shape">✦</div>
        <h1 class="hero-title">What should we focus on?</h1>
    </main>

    <!-- Bottom Floating Input Bar -->
    <div class="bottom-container">
        <div class="chat-input-bar">
            <button class="input-action-btn" title="Add attachment">+</button>
            <input type="text" class="chat-input-field" placeholder="Ask King Pro 6" id="userInput" />
            <button class="input-action-btn mic-btn" title="Voice search">🎤</button>
            <button class="input-action-btn audio-btn" title="Audio mode">🎛️</button>
        </div>
    </div>

</body>
</html>
